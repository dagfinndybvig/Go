<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jev Go — 9x9</title>
<style>
  body { background: #2b2b2b; color: #eee; font-family: Georgia, serif; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
  h1 { font-weight: normal; margin: 0 0 4px; }
  #status { min-height: 24px; margin: 8px 0; font-size: 18px; }
  #matchup { min-height: 24px; font-size: 19px; color: #ffd54f; }
  #modes { border: 1px solid #666; border-radius: 6px; padding: 8px 14px; margin-top: 10px; font-size: 13px; color: #ddd; background: rgba(0,0,0,.25); max-width: 560px; }
  #modes b { color: #ffd54f; }
  #modes a { color: #7ec8ff; }
  canvas { background: #dcb35c; border-radius: 4px; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,.5); }
  #boardwrap { position: relative; }
  #gameover { display: none; position: absolute; top: 42%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,.8); color: #ff5252; font-size: 32px; font-weight: bold; text-align: center; padding: 16px 26px; border-radius: 8px; pointer-events: none; max-width: 420px; line-height: 1.3; }
  #controls { margin-top: 12px; }
  button { background: #444; color: #eee; border: 1px solid #666; padding: 6px 16px; margin: 0 4px; font-size: 15px; border-radius: 4px; cursor: pointer; }
  button:hover { background: #555; }
  #score { margin-top: 10px; font-size: 15px; color: #bbb; }
  #jevhud { position: fixed; right: 16px; bottom: 12px; font-size: 13px; letter-spacing: 1px; font-family: monospace; }
  #autohud { display: none; position: fixed; left: 16px; bottom: 12px; color: #ffd54f; font-size: 13px; font-family: monospace; }
  #jevlog { display: none; position: fixed; left: 16px; bottom: 40px; background: rgba(0,0,0,.85); color: #cfc; font: 12px monospace; padding: 10px; border-radius: 6px; max-width: 460px; max-height: 40vh; overflow-y: auto; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Jev Go</h1>
<div id="matchup"></div>
<div id="status">Your move — you are Black.</div>
<div id="boardwrap">
<canvas id="board" width="468" height="468"></canvas>
<div id="gameover"></div>
</div>
<div id="controls">
  <button id="passBtn">Pass</button>
  <button id="undoBtn">Undo</button>
  <button id="newBtn">New game</button>
  <button id="autoBtn">Autoplay: off (0)</button>
  <button id="keyBtn">API key (J)</button>
  <button id="logBtn">Jev log (L)</button>
</div>
<div id="score"></div>
<div id="modes">
  <b>Player combinations</b> — you vs <b>Jev</b> (needs <code>node server.js</code> + API key) ·
  <b>local AI vs Jev</b> (autoplay)<br>
  Keys: <b>0</b> toggle autoplay · <b>J</b> enter API key (Jev needs it) · <b>L</b> Jev log ·
  or use the buttons above ·
  <a href="https://en.wikipedia.org/wiki/Go_(game)" target="_blank" rel="noopener">Go on Wikipedia</a>
</div>
<div id="jevhud"></div>
<div id="autohud">AUTOPLAY (0 to toggle)</div>
<div id="jevlog"></div>

<script>
'use strict';
const N = 9;                 // 9x9 board
const EMPTY = 0, BLACK = 1, WHITE = 2;
const MARGIN = 30, CELL = (468 - 2 * MARGIN) / (N - 1);

let board, turn, captures, history, lastMove, lastCoord, jevLastChoice, passes, gameOver;

function newGame() {
  board = Array.from({ length: N }, () => new Array(N).fill(EMPTY));
  turn = BLACK;
  captures = { 1: 0, 2: 0 };
  history = [];
  lastMove = null;
  lastCoord = null;
  jevLastChoice = null;
  passes = 0;
  gameOver = false;
  document.getElementById('gameover').style.display = 'none';
  setStatus('Your move — you are Black.');
  draw();
}

function neighbors(x, y) {
  const out = [];
  if (x > 0) out.push([x - 1, y]);
  if (x < N - 1) out.push([x + 1, y]);
  if (y > 0) out.push([x, y - 1]);
  if (y < N - 1) out.push([x, y + 1]);
  return out;
}

// Return the group containing (x,y) and its liberty count.
function groupAndLiberties(bd, x, y) {
  const color = bd[y][x];
  const seen = new Set(), group = [], stack = [[x, y]];
  seen.add(x + ',' + y);
  let libs = 0;
  const libSeen = new Set();
  while (stack.length) {
    const [cx, cy] = stack.pop();
    group.push([cx, cy]);
    for (const [nx, ny] of neighbors(cx, cy)) {
      const v = bd[ny][nx];
      if (v === EMPTY) {
        const k = nx + ',' + ny;
        if (!libSeen.has(k)) { libSeen.add(k); libs++; }
      } else if (v === color && !seen.has(nx + ',' + ny)) {
        seen.add(nx + ',' + ny);
        stack.push([nx, ny]);
      }
    }
  }
  return { group, libs };
}

// Try placing color at (x,y) on a copy of bd. Returns {legal, board, captured}
function tryMove(bd, x, y, color) {
  if (bd[y][x] !== EMPTY) return { legal: false };
  const nb = bd.map(r => r.slice());
  nb[y][x] = color;
  const opp = color === BLACK ? WHITE : BLACK;
  let captured = 0;
  for (const [nx, ny] of neighbors(x, y)) {
    if (nb[ny][nx] === opp) {
      const g = groupAndLiberties(nb, nx, ny);
      if (g.libs === 0) {
        for (const [gx, gy] of g.group) { nb[gy][gx] = EMPTY; captured++; }
      }
    }
  }
  const own = groupAndLiberties(nb, x, y);
  if (own.libs === 0) return { legal: false }; // suicide
  return { legal: true, board: nb, captured };
}

function isKo(prevBoard, nextBoard) {
  if (!prevBoard) return false;
  for (let y = 0; y < N; y++)
    for (let x = 0; x < N; x++)
      if (prevBoard[y][x] !== nextBoard[y][x]) return false;
  return true;
}

function humanPlay(x, y) {
  if (gameOver || autoplay || turn !== BLACK) return;
  const r = tryMove(board, x, y, BLACK);
  if (!r.legal) { setStatus('Illegal move.'); return; }
  if (isKo(lastMove, r.board)) { setStatus('Illegal: ko.'); return; }
  applyMove({ x, y, board: r.board, captured: r.captured }, BLACK);
}

function legalMoves(bd, color, koBoard) {
  const moves = [];
  for (let y = 0; y < N; y++)
    for (let x = 0; x < N; x++) {
      const r = tryMove(bd, x, y, color);
      if (r.legal && !isKo(koBoard, r.board)) moves.push({ x, y, captured: r.captured, board: r.board });
    }
  return moves;
}

// ---- Jev AI (TypeSafe System One) ----
// When a TypeSafe API key is available (browser key entered with J, or the
// server's TYPESAFE_API_KEY injected by server.js), White's moves are chosen
// by the Jev decision model. Jev always plays — no fallback to the local
// heuristic. On error or timeout, the game retries and waits.
const Jev = (() => {
  // On localhost (served by server.js), use the proxy. Elsewhere
  // (Pages, file://) go direct to the API — the browser key provides
  // the Authorization header. CORS will block this on Pages (the API
  // sends no CORS headers), but the error message is clearer than a 404.
  const PROXY = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  const ENDPOINT = PROXY ? '/jev' : 'https://api.typesafe.ai/v1/systemone';
  const MODEL = 'jev-latest';
  const COLS = 'ABCDEFGHJ';
  const LOG_MAX = 200;
  const log = [];

  let apiKey = '';
  try { apiKey = localStorage.getItem('typesafe_api_key') || ''; } catch (e) {}
  let serverKey = false;
  if (PROXY) {
    fetch('/jevstatus').then(r => r.json())
      .then(d => { serverKey = !!d.serverKey; refreshHud(); })
      .catch(() => {});
  }

  function coordName(x, y) { return COLS[x] + (y + 1); }

  function addLog(entry) {
    log.push(entry);
    if (log.length > LOG_MAX) log.shift();
  }

  function describeMove(m) {
    const bits = [];
    if (m.captured > 0) bits.push('captures ' + m.captured + (m.captured === 1 ? ' stone' : ' stones'));
    // Resulting own group liberties (group safety after the move)
    const ownG = groupAndLiberties(m.board, m.x, m.y);
    // Check if this move saves a friendly group from atari
    for (const [nx, ny] of neighbors(m.x, m.y)) {
      if (board[ny][nx] === WHITE) {
        const preG = groupAndLiberties(board, nx, ny);
        if (preG.libs === 1) {
          const postG = groupAndLiberties(m.board, nx, ny);
          bits.push('saves your group at ' + coordName(preG.group[0][0], preG.group[0][1]) + ' from atari (now ' + postG.libs + ' liberties)');
        }
      }
    }
    // Puts opponent group in atari or captures (already handled above for captures)
    let atari = false;
    for (const [nx, ny] of neighbors(m.x, m.y)) {
      if (m.board[ny][nx] === BLACK) {
        const g = groupAndLiberties(m.board, nx, ny);
        if (g.libs === 1) atari = true;
      }
    }
    if (atari) bits.push('puts an opponent group in atari');
    // Threatens opponent group (reduces to 2 liberties)
    let threatens = false;
    for (const [nx, ny] of neighbors(m.x, m.y)) {
      if (m.board[ny][nx] === BLACK) {
        const g = groupAndLiberties(m.board, nx, ny);
        if (g.libs === 2) threatens = true;
      }
    }
    if (threatens) bits.push('reduces an opponent group to 2 liberties');
    // Always report resulting group liberties so Jev can judge safety
    if (ownG.libs === 1) bits.push('self-atari (1 liberty after move)');
    else if (ownG.libs === 2) bits.push('unsafe (2 liberties after move)');
    else if (ownG.libs === 3) bits.push('3 liberties after move');
    else bits.push(ownG.libs + ' liberties after move');
    // Lookahead: simulate opponent's best reply on the resulting board.
    // This gives Jev a 1-ply forward view: "if I play here, opponent can
    // capture N / put me in atari / reduce me to 2 liberties".
    const oppMoves = legalMoves(m.board, BLACK, m.board);
    if (oppMoves.length) {
      let oppBestCap = 0, oppAtariYou = false, oppReduceYou = false;
      for (const om of oppMoves) {
        if (om.captured > oppBestCap) oppBestCap = om.captured;
        // Check if opponent's reply puts any White group in atari or 2-liberty danger
        for (const [ox, oy] of neighbors(om.x, om.y)) {
          if (om.board[oy][ox] === WHITE) {
            const wg = groupAndLiberties(om.board, ox, oy);
            if (wg.libs === 1) oppAtariYou = true;
            if (wg.libs === 2) oppReduceYou = true;
          }
        }
      }
      const lookahead = [];
      if (oppBestCap > 0) lookahead.push('opponent can capture ' + oppBestCap + ' stone' + (oppBestCap === 1 ? '' : 's') + ' in reply');
      if (oppAtariYou) lookahead.push('opponent can put you in atari in reply');
      else if (oppReduceYou) lookahead.push('opponent can reduce your group to 2 liberties in reply');
      if (!lookahead.length) lookahead.push('opponent has no immediate threat in reply');
      bits.push(lookahead.join('; '));
    }
    // Approaches / extends
    let extendsOwn = false, approachesEnemy = false;
    for (const [nx, ny] of neighbors(m.x, m.y)) {
      if (m.board[ny][nx] === WHITE) extendsOwn = true;
      if (board[ny] && board[ny][nx] === BLACK) approachesEnemy = true;
    }
    if (extendsOwn) bits.push('extends your group');
    if (approachesEnemy) bits.push('contact with enemy');
    if (!bits.length) {
      const edge = m.x === 0 || m.x === N - 1 || m.y === 0 || m.y === N - 1;
      bits.push(edge ? 'edge point' : 'open point');
    }
    return coordName(m.x, m.y) + ' — ' + bits.join(', ');
  }

  function boardText() {
    const lines = [];
    for (let y = N - 1; y >= 0; y--) {
      let row = (y + 1) + ' ';
      for (let x = 0; x < N; x++) {
        row += board[y][x] === BLACK ? 'O' : board[y][x] === WHITE ? 'X' : '.';
        if (x < N - 1) row += ' ';
      }
      lines.push(row);
    }
    lines.push('  ' + COLS.split('').join(' '));
    return lines.join('\n');
  }

  // Rough territory estimate: stones on board + empty regions surrounded
  // by one color. Same logic as endGame scoring, but called mid-game to
  // give Jev a sense of who is ahead.
  function territoryEstimate() {
    const seen = new Set();
    let stonesB = 0, stonesW = 0, terrB = 0, terrW = 0;
    for (let y = 0; y < N; y++)
      for (let x = 0; x < N; x++) {
        if (board[y][x] === BLACK) stonesB++;
        if (board[y][x] === WHITE) stonesW++;
      }
    for (let y = 0; y < N; y++)
      for (let x = 0; x < N; x++) {
        if (board[y][x] !== EMPTY || seen.has(x + ',' + y)) continue;
        const region = [], stack = [[x, y]];
        seen.add(x + ',' + y);
        const touch = new Set();
        while (stack.length) {
          const [cx, cy] = stack.pop();
          region.push([cx, cy]);
          for (const [nx, ny] of neighbors(cx, cy)) {
            const v = board[ny][nx];
            if (v === EMPTY) { if (!seen.has(nx + ',' + ny)) { seen.add(nx + ',' + ny); stack.push([nx, ny]); } }
            else touch.add(v);
          }
        }
        if (touch.size === 1) {
          const c = [...touch][0];
          if (c === BLACK) terrB += region.length; else terrW += region.length;
        }
      }
    const scoreB = stonesB + terrB, scoreW = stonesW + terrW + 5.5;
    return { scoreB, scoreW, stonesB, stonesW, terrB, terrW };
  }

  function buildState(moves) {
    // Scan for groups with 1-2 liberties (threats both colors must respond to)
    const seen = new Set();
    const threats = [];
    for (let y = 0; y < N; y++)
      for (let xx = 0; xx < N; xx++) {
        if (board[y][xx] === EMPTY || seen.has(xx + ',' + y)) continue;
        const g = groupAndLiberties(board, xx, y);
        for (const [gx, gy] of g.group) seen.add(gx + ',' + gy);
        if (g.libs <= 2) {
          const color = board[y][xx] === WHITE ? 'your' : 'opponent';
          const label = g.libs === 1 ? 'atari' : '2 liberties';
          const stones = g.group.map(c => coordName(c[0], c[1])).join(',');
          threats.push(color + ' group [' + stones + '] has ' + label + ' (' + g.group.length + ' stone' + (g.group.length === 1 ? '' : 's') + ')');
        }
      }
    const lines = [
      'Game of Go on a 9x9 board. You are White (X); your opponent is Black (O). You receive komi 5.5.',
      'Area scoring: at game end each side scores its stones on the board plus empty regions it surrounds alone. Two consecutive passes end the game.',
      'Captures so far: you ' + captures[WHITE] + ', opponent ' + captures[BLACK] + '.',
      'Current board (rows 9 at top down to 1, columns A-J):',
      boardText(),
      "Opponent's last move: " + (lastCoord ? coordName(lastCoord.x, lastCoord.y) : 'none (start of game or a pass)'),
      'Your previous move: ' + (jevLastChoice || 'none yet'),
    ];
    // Territory estimate so Jev knows if it is ahead or behind
    const est = territoryEstimate();
    const leader = est.scoreW > est.scoreB ? 'you' : est.scoreB > est.scoreW ? 'opponent' : 'neither';
    lines.push('Approximate score right now — you: ' + est.scoreW + ' (stones ' + est.stonesW + ' + territory ' + est.terrW + ' + komi 5.5), opponent: ' + est.scoreB + ' (stones ' + est.stonesB + ' + territory ' + est.terrB + '). ' + (leader === 'you' ? 'You are ahead — consolidate and defend.' : leader === 'opponent' ? 'You are behind — attack weak opponent groups and fight for territory.' : 'The game is even — play carefully to gain an advantage.'));
    if (threats.length) {
      lines.push('Groups in danger:');
      for (const t of threats) lines.push('  ' + t);
    }
    lines.push('There are ' + moves.length + ' candidate moves, listed in the criteria. Choose the strongest point for White. Prioritise saving your groups from atari, capturing opponent groups in atari, and attacking weak opponent groups. On 9x9, group safety is critical — keep your groups connected and do not let them get surrounded. Do not pass while there are still open points on the board — passing gives the opponent a free move and costs you territory.');
    return lines.join('\n');
  }

  async function query(moves) {
    const criteria = {};
    for (const m of moves) criteria[coordName(m.x, m.y)] = describeMove(m);
    // Only offer pass when the board is nearly full — passing while there
    // are open points just gives the opponent a free move.
    let emptyCount = 0;
    for (let y = 0; y < N; y++)
      for (let x = 0; x < N; x++)
        if (board[y][x] === EMPTY) emptyCount++;
    if (emptyCount <= 3)
      criteria.pass = 'skip your turn; if both players pass in a row the game ends and the position is scored';
    else
      criteria.pass = 'not recommended — there are still ' + emptyCount + ' open points on the board. Passing gives the opponent a free move. Only pass when the board is settled and all remaining moves would reduce your territory.';
    const stateStr = buildState(moves);
    const body = {
      model: MODEL,
      state: stateStr,
      questions: {
        move: {
          type: 'choice',
          instructions: 'Which point should White play next? Save groups in atari first, then capture or attack weak opponent groups, then build territory. Avoid self-atari unless it captures. Each option lists its tactical effects.',
          criteria,
        },
      },
    };
    const ctrl = new AbortController();
    const timeout = setTimeout(() => ctrl.abort(), 10000);
    let resp;
    try {
      resp = await fetch(ENDPOINT, {
        method: 'POST',
        headers: {
          ...(apiKey ? { 'Authorization': 'Bearer ' + apiKey } : {}),
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(body),
        signal: ctrl.signal,
      });
    } catch (e) {
      throw new Error(e.name === 'AbortError' ? 'timeout' : 'network');
    } finally {
      clearTimeout(timeout);
    }
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    const ans = data.answers && data.answers.move;
    if (!ans || !ans.choice) throw new Error('no choice in response');
    return { choice: ans.choice, confidence: ans.confidence || 0, probabilities: ans.probabilities || null, state: stateStr };
  }

  // Filter legal moves to the most relevant ones so Jev can focus.
  // Always include: captures, atari saves, moves near existing stones.
  // Limit to MAX_OPTIONS to avoid overwhelming the decision model.
  const MAX_OPTIONS = 30;
  function filterMoves(moves) {
    if (moves.length <= MAX_OPTIONS) return moves;
    const scored = moves.map(m => {
      let s = 0;
      if (m.captured > 0) s += 1000;
      // Near existing stones (Manhattan distance ≤ 2)
      let nearStones = false;
      for (let dy = -2; dy <= 2; dy++)
        for (let dx = -2; dx <= 2; dx++) {
          const nx = m.x + dx, ny = m.y + dy;
          if (nx < 0 || nx >= N || ny < 0 || ny >= N) continue;
          if (board[ny][nx] !== EMPTY) nearStones = true;
        }
      if (nearStones) s += 100;
      // Center bias
      s += 10 - (Math.abs(m.x - 4) + Math.abs(m.y - 4));
      // Slight randomness for variety
      s += Math.random() * 5;
      return { m, s };
    });
    scored.sort((a, b) => b.s - a.s);
    return scored.slice(0, MAX_OPTIONS).map(x => x.m);
  }

  async function chooseMove(moves) {
    const filtered = filterMoves(moves);
    const res = await query(filtered);
    // Play Jev's best option: the highest-probability legal move. No
    // temperature sampling — Jev plays optimally, not for variety.
    let picked = res.choice;
    if (res.probabilities) {
      const legal = new Set(filtered.map(m => coordName(m.x, m.y)));
      legal.add('pass');
      const entries = Object.entries(res.probabilities).filter(([k]) => legal.has(k));
      if (entries.length) {
        picked = entries.reduce((a, b) => (b[1] > a[1] ? b : a))[0];
      }
    }
    jevLastChoice = picked === 'pass' ? null : picked;
    addLog({ t: Date.now(), ok: true, choice: picked, jevChoice: res.choice, confidence: res.confidence, state: res.state, probabilities: res.probabilities });
    return picked;
  }

  return {
    chooseMove,
    coordName,
    isEnabled() { return !!(apiKey || serverKey); },
    isProxied() { return PROXY; },
    logEntry(entry) { addLog(entry); },
    getLog() { return log.slice(); },
    clearLog() { log.length = 0; },
    setKey(key) {
      apiKey = key || '';
      try { localStorage.setItem('typesafe_api_key', apiKey); } catch (e) {}
    },
    getKey() { return apiKey; },
  };
})();
window.jevLog = () => Jev.getLog();
window.jevClear = () => Jev.clearLog();

// Local greedy AI — capture if possible, else save own weak groups /
// attack weak enemy groups, with slight preference for the center.
// Drives Black in autoplay mode (against Jev's White).
function heuristicPick(moves, color) {
  if (!moves || !moves.length) return { pass: true };
  const opp = color === BLACK ? WHITE : BLACK;
  let best = null, bestScore = -Infinity;
  for (const m of moves) {
    let s = m.captured * 100;
    // After the move, how exposed are we to a capture by the opponent?
    const oppMoves = legalMoves(m.board, opp, m.board);
    let oppBestCapture = 0;
    for (const om of oppMoves) oppBestCapture = Math.max(oppBestCapture, om.captured);
    s -= oppBestCapture * 80;
    // Liberty pressure: count liberties gained vs opponent threats nearby
    const g = groupAndLiberties(m.board, m.x, m.y);
    s += g.libs * 4;
    s -= Math.abs(m.x - 4) + Math.abs(m.y - 4); // mild center bias
    s += Math.random() * 2; // tie-break variety
    if (s > bestScore) { bestScore = s; best = m; }
  }

  // Pass when only hopeless moves remain and nothing is being captured
  if (best.captured === 0 && bestScore < -40) return { pass: true };
  return { move: best };
}

const AUTO_DELAY = 700; // pause between autoplay moves

// Player labels. White is always Jev — no fallback to the local heuristic.
// In autoplay the local heuristic drives Black against Jev's White.
function labels() {
  if (!autoplay) return { black: 'You', white: 'Jev' };
  return { black: 'Local AI', white: 'Jev' };
}

function applyMove(m, color) {
  history.push({ board, captures: { ...captures }, lastMove, passes });
  board = m.board;
  captures[color] += m.captured;
  lastMove = m.board;
  lastCoord = { x: m.x, y: m.y };
  passes = 0;
  turn = color === BLACK ? WHITE : BLACK;
  draw();
  if (color === BLACK) {
    setStatus(labels().white + ' (White) is thinking...');
    setTimeout(jevMove, autoplay ? AUTO_DELAY : 350);
  } else if (autoplay) {
    const L = labels();
    setStatus(L.white + ' (White) played. ' + L.black + ' (Black) is thinking...');
    setTimeout(blackAutoMove, AUTO_DELAY);
  } else {
    setStatus('Your move.');
  }
}

// Autoplay: the local heuristic drives Black against Jev's White.
function blackAutoMove() {
  if (gameOver || !autoplay || turn !== BLACK) return;
  const moves = legalMoves(board, BLACK, lastMove);
  if (!moves.length) { doPass(BLACK); return; }
  const pick = heuristicPick(moves, BLACK);
  if (pick.pass) { doPass(BLACK); return; }
  applyMove(pick.move, BLACK);
}

// White's turn: Jev plays. No fallback to the local heuristic.
function jevMove(retries) {
  if (gameOver) return;
  if (retries === undefined) retries = 0;
  const moves = legalMoves(board, WHITE, lastMove);
  if (!moves.length) { doPass(WHITE); return; }
  if (!Jev.isEnabled()) {
    setHud(false);
    if (Jev.isProxied())
      setStatus('Jev API key required — press J to enter a key.');
    else
      setStatus('Jev needs the local server (node server.js) and an API key. Press J to enter a key, or run the server and reload.');
    return;
  }
  setHud(true);
  setStatus(labels().white + ' (White) is thinking...');
  Jev.chooseMove(moves).then(sel => {
    if (gameOver) return;
    if (sel === 'pass') { doPass(WHITE); return; }
    const m = moves.find(mv => Jev.coordName(mv.x, mv.y) === sel);
    if (m) applyMove(m, WHITE);
    else if (retries < 3) {
      Jev.logEntry({ t: Date.now(), ok: false, reason: 'Jev chose illegal point ' + sel, choice: sel, confidence: null, state: null, probabilities: null });
      setStatus('Jev returned an illegal move — retrying...');
      setTimeout(() => jevMove(retries + 1), 1000);
    } else {
      Jev.logEntry({ t: Date.now(), ok: false, reason: 'Jev chose illegal point ' + sel + ' after ' + retries + ' retries', choice: sel, confidence: null, state: null, probabilities: null });
      setStatus('Jev error — illegal move. Press J to check your API key' + (Jev.isProxied() ? '.' : ', or run node server.js locally.'));
    }
  }).catch(err => {
    const reason = err && err.message ? err.message : String(err);
    Jev.logEntry({ t: Date.now(), ok: false, reason, choice: null, confidence: null, state: null, probabilities: null });
    if (retries < 3) {
      setStatus('Jev error (' + reason + ') — retrying...');
      setTimeout(() => jevMove(retries + 1), 1000);
    } else {
      setStatus('Jev error after ' + (retries + 1) + ' attempts: ' + reason + '. Press J to check your API key' + (Jev.isProxied() ? '.' : ', or run node server.js locally.'));
    }
  });
}

function doPass(color) {
  if (gameOver) return;
  history.push({ board, captures: { ...captures }, lastMove, passes });
  passes++;
  lastMove = null;
  lastCoord = null;
  if (passes >= 2) { endGame(); return; }
  if (color === WHITE) {
    turn = BLACK;
    draw();
    const L = labels();
    if (autoplay) { setStatus(L.white + ' (White) passed. ' + L.black + ' (Black) is thinking...'); setTimeout(blackAutoMove, AUTO_DELAY); }
    else setStatus(L.white + ' (White) passed. Your move — pass again to end.');
  } else {
    turn = WHITE;
    draw();
    const L = labels();
    if (autoplay) { setStatus(L.black + ' (Black) passed. ' + L.white + ' (White) is thinking...'); setTimeout(jevMove, AUTO_DELAY); }
    else { setStatus('You passed. ' + L.white + ' (White) is thinking...'); setTimeout(jevMove, 350); }
  }
}

function endGame() {
  gameOver = true;
  // Area scoring: stones on board + empty regions touching only one color.
  const owner = Array.from({ length: N }, () => new Array(N).fill(EMPTY));
  const seen = new Set();
  let terrB = 0, terrW = 0;
  for (let y = 0; y < N; y++)
    for (let x = 0; x < N; x++) {
      if (board[y][x] !== EMPTY || seen.has(x + ',' + y)) continue;
      const region = [], stack = [[x, y]];
      seen.add(x + ',' + y);
      const touch = new Set();
      while (stack.length) {
        const [cx, cy] = stack.pop();
        region.push([cx, cy]);
        for (const [nx, ny] of neighbors(cx, cy)) {
          const v = board[ny][nx];
          if (v === EMPTY) {
            if (!seen.has(nx + ',' + ny)) { seen.add(nx + ',' + ny); stack.push([nx, ny]); }
          } else touch.add(v);
        }
      }
      if (touch.size === 1) {
        const c = [...touch][0];
        for (const [rx, ry] of region) owner[ry][rx] = c;
        if (c === BLACK) terrB += region.length; else terrW += region.length;
      }
    }
  let stonesB = 0, stonesW = 0;
  for (let y = 0; y < N; y++)
    for (let x = 0; x < N; x++) {
      if (board[y][x] === BLACK) stonesB++;
      if (board[y][x] === WHITE) stonesW++;
    }
  const scoreB = stonesB + terrB, scoreW = stonesW + terrW + 5.5; // komi
  const L = labels();
  let msg;
  if (scoreB > scoreW) msg = autoplay ? 'Game over — ' + L.black + ' (Black) wins, ' + scoreB + ' to ' + scoreW + '.' : 'Game over — you win, ' + scoreB + ' to ' + scoreW + '.';
  else if (scoreW > scoreB) msg = 'Game over — ' + L.white + ' (White) wins, ' + scoreW + ' to ' + scoreB + '.';
  else msg = 'Game over — draw.';
  setStatus(msg + ' (komi 5.5 for White)');
  draw(owner);
  const overlay = document.getElementById('gameover');
  overlay.textContent = msg;
  overlay.style.display = 'block';
  if (autoplay) setTimeout(() => { newGame(); if (autoplay) setTimeout(blackAutoMove, AUTO_DELAY); }, 4000);
}

function undo() {
  if (!history.length || gameOver || autoplay) return;
  const h = history.pop();
  board = h.board;
  captures = h.captures;
  lastMove = h.lastMove;
  lastCoord = null;
  passes = h.passes;
  turn = BLACK; // undo returns to the human's turn
  gameOver = false;
  document.getElementById('gameover').style.display = 'none';
  setStatus('Your move — you are Black.');
  draw();
}

function setStatus(t) { document.getElementById('status').textContent = t; }

function draw(territory) {
  const ctx = document.getElementById('board').getContext('2d');
  ctx.clearRect(0, 0, 468, 468);
  ctx.strokeStyle = '#5a3d1e';
  ctx.lineWidth = 1;
  for (let i = 0; i < N; i++) {
    ctx.beginPath();
    ctx.moveTo(MARGIN, MARGIN + i * CELL); ctx.lineTo(MARGIN + (N - 1) * CELL, MARGIN + i * CELL);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(MARGIN + i * CELL, MARGIN); ctx.lineTo(MARGIN + i * CELL, MARGIN + (N - 1) * CELL);
    ctx.stroke();
  }
  // star points (hoshi) for 9x9
  for (const [sx, sy] of [[2,2],[6,2],[4,4],[2,6],[6,6]]) {
    ctx.beginPath();
    ctx.arc(MARGIN + sx * CELL, MARGIN + (N - 1 - sy) * CELL, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#5a3d1e';
    ctx.fill();
  }
  const R = CELL * 0.46;
  for (let y = 0; y < N; y++)
    for (let x = 0; x < N; x++) {
      const v = board[y][x];
      const px = MARGIN + x * CELL, py = MARGIN + (N - 1 - y) * CELL;
      if (v !== EMPTY) {
        ctx.beginPath();
        ctx.arc(px, py, R, 0, Math.PI * 2);
        ctx.fillStyle = v === BLACK ? '#111' : '#f5f5f5';
        ctx.fill();
        ctx.strokeStyle = v === BLACK ? '#000' : '#999';
        ctx.stroke();
      } else if (territory && territory[y][x] !== EMPTY) {
        ctx.beginPath();
        ctx.arc(px, py, 5, 0, Math.PI * 2);
        ctx.fillStyle = territory[y][x] === BLACK ? '#111' : '#f5f5f5';
        ctx.fill();
      }
    }
  updateScoreLine();
}

function updateScoreLine() {
  const L = labels();
  document.getElementById('score').textContent =
    'Captures — \u25CF ' + L.black + ' (Black): ' + captures[BLACK] +
    '   \u25CB ' + L.white + ' (White): ' + captures[WHITE];
}

document.getElementById('board').addEventListener('click', e => {
  const rect = e.target.getBoundingClientRect();
  const x = Math.round((e.clientX - rect.left - MARGIN) / CELL);
  const y = (N - 1) - Math.round((e.clientY - rect.top - MARGIN) / CELL);
  if (x >= 0 && x < N && y >= 0 && y < N) humanPlay(x, y);
});
document.getElementById('passBtn').addEventListener('click', () => { if (!autoplay) doPass(BLACK); });
document.getElementById('undoBtn').addEventListener('click', undo);
document.getElementById('newBtn').addEventListener('click', newGame);

let autoplay = false;
function toggleAutoplay() {
  autoplay = !autoplay;
  document.getElementById('autohud').style.display = autoplay ? 'block' : 'none';
  document.getElementById('autoBtn').textContent = autoplay ? 'Autoplay: on (0)' : 'Autoplay: off (0)';
  refreshHud();
  if (autoplay) {
    if (gameOver) newGame();
    const L = labels();
    setStatus('Autoplay: ' + L.black + ' (Black) vs ' + L.white + ' (White).');
    if (turn === BLACK) setTimeout(blackAutoMove, AUTO_DELAY);
    // if it is White's turn, a pending Jev decision resumes the loop
  } else {
    setStatus(turn === BLACK ? 'Your move — you are Black.' : labels().white + ' (White) is thinking...');
  }
}

function setHud(enabled) {
  const el = document.getElementById('jevhud');
  el.textContent = 'WHITE: ' + (enabled ? 'JEV' : 'JEV (NO KEY)');
  el.style.color = enabled ? '#4caf50' : '#e53935';
  updateScoreLine();
  updateMatchup();
}

function updateMatchup() {
  const L = labels();
  document.getElementById('matchup').textContent =
    '\u25CF ' + L.black + ' (Black)  vs  \u25CB ' + L.white + ' (White)';
}
function refreshHud() { setHud(Jev.isEnabled()); }

function renderJevLog() {
  const panel = document.getElementById('jevlog');
  const entries = Jev.getLog().slice(-10).reverse();
  panel.textContent = entries.map(e =>
    new Date(e.t).toLocaleTimeString() + '  ' +
    (e.ok
      ? 'play ' + e.choice + '  conf ' + e.confidence.toFixed(2) + (e.jevChoice !== e.choice ? '  (jev: ' + e.jevChoice + ')' : '')
      : 'error: ' + e.reason)
  ).join('\n') || 'No Jev decisions yet.';
}

function promptForKey() {
  const key = prompt('Enter TypeSafe API key (leave empty to disable Jev — White will not move without a key). Note: Jev only works when served by node server.js on localhost — on GitHub Pages or file:// the API blocks cross-origin calls even with a key.', Jev.getKey() || '');
  if (key !== null) Jev.setKey(key.trim());
  refreshHud();
}
function toggleLog() {
  const panel = document.getElementById('jevlog');
  const show = panel.style.display !== 'block';
  panel.style.display = show ? 'block' : 'none';
  if (show) renderJevLog();
}
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'j') promptForKey();
  else if (k === '0') toggleAutoplay();
  else if (k === 'l') toggleLog();
});
document.getElementById('autoBtn').addEventListener('click', toggleAutoplay);
document.getElementById('keyBtn').addEventListener('click', promptForKey);
document.getElementById('logBtn').addEventListener('click', toggleLog);

newGame();
refreshHud();
updateMatchup();
</script>
</body>
</html>
